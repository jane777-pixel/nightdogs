# Sveltia CMS configuration: https://sveltiacms.app/en/docs
# Authors sign in with their GitHub account (see docs/CMS.md).

backend:
  name: github
  repo: jane777-pixel/nightdogs
  branch: main
  base_url: https://nightdogs.xyz
  auth_endpoint: api/cms-auth
  commit_messages:
    create: "New post: {{slug}} (by {{author-name}})"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://nightdogs.xyz
display_url: https://nightdogs.xyz
logo_url: /favicon.svg

# Uploads go next to the post they belong to (set per collection below).
# This shared folder is only used by the "Assets" library.
media_folder: public/img/uploads
public_folder: /img/uploads

media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 26214400 # 25 MB
      transformations:
        # Phone photos (including iPhone HEIC) are converted to WebP and
        # resized before upload, so posts stay quick to load.
        raster_image:
          format: webp
          quality: 82
          width: 2400
          height: 2400

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: "blog"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Write a new post or edit an old one. Photos you add here are stored with the post."
    folder: "content/blog"
    create: true
    path: "{{author}}/{{year}}-{{month}}-{{day}}/{{slug}}/index"
    slug: "{{title}}"
    media_folder: ""
    public_folder: ""
    sortable_fields: ["date", "title", "author"]
    view_groups:
      - { label: "Author", field: "author" }
    summary: "{{title}} · {{author}} · {{date | date('YYYY-MM-DD')}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Author"
        name: "author"
        widget: "select"
        options: &author_options
          - { label: "Jane", value: "jane" }
          - { label: "Abby", value: "abby" }
          - { label: "Adèsse", value: "adesse" }
          - { label: "Orion", value: "orionlw" }
          - { label: "Amelia", value: "amelia" }
          - { label: "Nic", value: "nic" }
          - { label: "Ewan", value: "ewan" }
      - label: "Date"
        name: "date"
        widget: "datetime"
        hint: "Defaults to now. The post's web address uses this date."
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "Turn on to save without publishing. Turn off when you're ready for it to go live."
      - label: "Photo layout"
        name: "photoLayout"
        widget: "select"
        default: "column"
        required: false
        options:
          - { label: "Column — one photo after another, full width", value: "column" }
          - { label: "Grid — thumbnails side by side, tap to enlarge", value: "grid" }
        hint: "Grid works well for posts with lots of photos."
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Optional. Tags already in use: music, pictures, fibre arts, concrete, swimming, cats, horses, farm animals, complaints, politics, capitalism, birthday, art, painting, folkart, reading, gardening, baking, video, trips, friends, eggs, baskets"
      - label: "Short description"
        name: "description"
        widget: "text"
        required: false
        hint: "Optional. One or two sentences shown in previews and when the post is shared."
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: >-
          To add a photo, use the image button in the toolbar.
          “Alt text” describes the photo for people who can't see it (e.g. “a grey cat asleep on a wool blanket”).
          “Title” becomes a caption shown under the photo.
          Photos placed one after another are grouped together.

  - name: "pages"
    label: "Site settings"
    files:
      - label: "Authors"
        name: "authors"
        file: "_data/authors.json"
        description: "Names, bios, links and colours for each author."
        fields:
          - label: "Jane Marie Bach"
            name: "jane"
            widget: "object"
            collapsed: true
            fields: &author_fields
              - { label: "Display name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false, hint: "A few lines about you. Shown on your author page." }
              - { label: "Note", name: "note", widget: "string", required: false, hint: "A few emoji or a short tagline" }
              - { label: "Dog person?", name: "isDogPerson", widget: "boolean", required: false, default: false, hint: "Turns the Cat page into a Dog page when your theme is picked." }
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
              - label: "Colours & fonts"
                name: "theme"
                widget: "object"
                collapsed: true
                hint: "Keep text readable: aim for strong contrast between Background and Text/Links."
                fields:
                  - label: "Light mode"
                    name: "light"
                    widget: "object"
                    fields: &color_fields
                      - { label: "Background", name: "background", widget: "color" }
                      - { label: "Text", name: "color", widget: "color" }
                      - { label: "Links & buttons", name: "primary", widget: "color" }
                      - { label: "Dates & muted text", name: "muted", widget: "color" }
                  - { label: "Dark mode", name: "dark", widget: "object", fields: *color_fields }
                  - label: "Fonts"
                    name: "fonts"
                    widget: "object"
                    fields:
                      - { label: "Body", name: "body", widget: "string" }
                      - { label: "Headings", name: "header", widget: "string" }
                      - { label: "Code", name: "mono", widget: "string", required: false }
          - label: "Abby Rhynold"
            name: "abby"
            widget: "object"
            collapsed: true
            fields: *author_fields
          - label: "Adèsse Brown"
            name: "adesse"
            widget: "object"
            collapsed: true
            fields: *author_fields
          - label: "Orion Leidl Wilson"
            name: "orionlw"
            widget: "object"
            collapsed: true
            fields: *author_fields
          - label: "Amelia Wheeler"
            name: "amelia"
            widget: "object"
            collapsed: true
            fields: *author_fields
          - label: "Nic Leighton"
            name: "nic"
            widget: "object"
            collapsed: true
            fields: *author_fields
          - label: "Ewan MacLean"
            name: "ewan"
            widget: "object"
            collapsed: true
            fields: *author_fields
