[build]
publish = "_site"
command = "npm ci && npm run build-fast"

[build.environment]
NODE_VERSION = "22"
ELEVENTY_ENV = "development"
# Skip installing optional dependencies for faster builds
NPM_FLAGS = "--omit=optional"
URL = "https://nightdogs.xyz"

[[plugins]]
package = "netlify-plugin-cache"

[plugins.inputs]
paths = [".cache"]

[[redirects]]
from = "/admin/*"
to = "/admin/index.html"
status = 200

# Security headers for admin pages
[[headers]]
for = "/admin/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"


[[redirects]]
from = "/.well-known/host-meta*"
to = "https://fed.brid.gy/.well-known/host-meta:splat"
status = 302
[[redirects]]
from = "/.well-known/webfinger*"
to = "https://fed.brid.gy/.well-known/webfinger"
status = 302
