[build]
publish = "_site"
command = "npm run build"

[build.environment]
NODE_VERSION = "22"
URL = "https://nightdogs.xyz"

# Keep generated images and fetched data between builds so only new photos
# are processed on each deploy.
[[plugins]]
package = "netlify-plugin-cache"

[plugins.inputs]
paths = [".cache", "_site/img"]

# Old listing pages now live on /explore/
[[redirects]]
from = "/blog/"
to = "/explore/"
status = 301

[[redirects]]
from = "/tags/"
to = "/explore/"
status = 301

# Posts that moved when their files were tidied up
[[redirects]]
from = "/blog/jane/2026-03-06/sundogs/index-1/"
to = "/blog/jane/2026-03-06/sundogs/"
status = 301

[[redirects]]
from = "/blog/nic/2025-08-07/poisoned-by-my-enemies/index-1/"
to = "/blog/nic/2025-08-07/poisoned-by-my-enemies/"
status = 301

# Fediverse (Bridgy Fed)
[[redirects]]
from = "/.well-known/host-meta*"
to = "https://fed.brid.gy/.well-known/host-meta:splat"
status = 302

[[redirects]]
from = "/.well-known/webfinger*"
to = "https://fed.brid.gy/.well-known/webfinger"
status = 302

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/admin/*"
[headers.values]
X-Frame-Options = "DENY"
Cache-Control = "no-cache"
